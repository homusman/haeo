name: Homusman stability LP tests

on:
  push:
    branches: [main]
    paths:
      - "custom_components/haeo_homusman/core/model/**"
      - "custom_components/haeo_homusman/coordinator/**"
      - "tests/test_homusman_stability.py"
      - ".github/workflows/homusman-stability-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LP test dependencies
        run: python -m pip install "numpy>=2.3.2" "highspy>=1.15.1" "pytest>=9.0.0"
      - name: Verify Python syntax
        run: python -m compileall -q custom_components/haeo_homusman
      - name: Test economic stability behavior
        run: python -m pytest -q --noconftest tests/test_homusman_stability.py
