name: Publish HAEO Homusman HACS release

on:
  push:
    branches: [main, plan-acceptance-preview]
    paths:
      - "custom_components/haeo_homusman/**"
      - "frontend/haeo-forecast-card/**"
      - ".github/workflows/homusman-hacs-release.yml"
      - "tests/test_homusman_*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homusman-haeo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate standalone domain and Python syntax
        run: |
          python -m compileall -q custom_components/haeo_homusman
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/haeo_homusman/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          assert manifest["domain"] == "haeo_homusman"
          assert hacs["zip_release"] and hacs["filename"] == "haeo_homusman.zip"
          assert not Path("custom_components/haeo").exists()
          PY
      - name: Run economic regression tests
        run: |
          python -m pip install "numpy>=2.3.2" "highspy>=1.15.1" "typing-extensions>=4" "pytest>=9.0.0" "ruff>=0.14.0"
          python -m ruff check --select F821 custom_components/haeo_homusman
          python -m pytest -q --noconftest -c /dev/null tests/test_homusman_stability.py
      - name: Test coordinator startup against Home Assistant
        run: |
          python -m pip install "homeassistant==2026.1.1"
          python -m pytest -q --noconftest -c /dev/null tests/test_homusman_startup.py
      - name: Build standalone Lovelace card assets
        run: |
          npm --prefix frontend/haeo-forecast-card ci
          npm --prefix frontend/haeo-forecast-card run typecheck
          npm --prefix frontend/haeo-forecast-card test
          npm --prefix frontend/haeo-forecast-card run build
          python - <<'PY'
          from pathlib import Path
          directory = Path("custom_components/haeo_homusman/www")
          for name in ("haeo-homusman-forecast-card.min.js", "haeo-homusman-topology-card.min.js"):
              source = (directory / name).read_text()
              assert "haeo-homusman" in source, name
          main = (directory / "haeo-homusman-forecast-card.min.js").read_text()
          assert "HAEO Homusman Forecast Card" in main
          assert "HAEO Homusman Network Topology Card" in (directory / "haeo-homusman-topology-card.min.js").read_text()
          assert "haeo_homusman" in main, "Fork card editor must target fork integration domain"
          assert "integration:`haeo`" not in main, "Upstream HAEO selector leaked into compiled card"
          assert not Path("custom_components/haeo").exists()
          PY
      - name: Determine and stamp next release version
        id: version
        if: github.ref_name != 'plan-acceptance-preview'
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          path = pathlib.Path("custom_components/haeo_homusman/manifest.json")
          manifest = json.loads(path.read_text())
          current = tuple(map(int, manifest["version"].split(".")))
          stable = []
          for tag in subprocess.check_output(["git", "tag", "--list"], text=True).splitlines():
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", tag)
              if match:
                  stable.append(tuple(map(int, match.groups())))
          version = current if not stable or current > max(stable) else (max(stable)[0], max(stable)[1], max(stable)[2] + 1)
          label = ".".join(map(str, version))
          manifest["version"] = label
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          project = pathlib.Path("pyproject.toml")
          original = project.read_text()
          project.write_text(re.sub(r'(?m)^(version = )"[^"]+"$', lambda m: m[1] + '"' + label + '"', original, count=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={label}\n")
          print("Releasing v" + label)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/haeo_homusman/manifest.json"))["version"])')
          git add custom_components/haeo_homusman/manifest.json pyproject.toml
          git commit --allow-empty -m "release: v${VERSION}"
          git tag "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"
      - name: Stamp isolated preview
        if: github.ref_name == 'plan-acceptance-preview'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("custom_components/haeo_homusman/manifest.json")
          manifest = json.loads(path.read_text())
          assert manifest["version"] == "0.5.4b14"
          PY
      - name: Package HACS integration
        run: |
          cd custom_components/haeo_homusman
          zip -r -y "${GITHUB_WORKSPACE}/haeo_homusman.zip" . \
            -x "*/__pycache__/*" "__pycache__/*" "*.pyc" \
               "*/tests/*" "tests/*"
      - name: Publish versioned GitHub release
        if: github.ref_name != 'plan-acceptance-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum haeo_homusman.zip > haeo_homusman.zip.sha256
          notes=(--generate-notes)
          if [[ "${{ steps.version.outputs.version }}" == "0.6.0" ]]; then
            notes=(--notes-file docs/homusman-v0.6.0.md)
          elif [[ "${{ steps.version.outputs.version }}" == "0.6.1" ]]; then
            notes=(--notes-file docs/homusman-v0.6.1.md)
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            haeo_homusman.zip haeo_homusman.zip.sha256 --repo "${{ github.repository }}" \
            --title "HAEO - Homusman fork v${{ steps.version.outputs.version }}" \
            "${notes[@]}" --latest

      - name: Publish plan acceptance preview
        if: github.ref_name == 'plan-acceptance-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum haeo_homusman.zip > haeo_homusman.zip.sha256
          gh release create v0.5.4b14 haeo_homusman.zip haeo_homusman.zip.sha256 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "HAEO Homusman v0.5.4b14" --prerelease --latest=false \
            --notes-file docs/homusman-plan-preview.md
